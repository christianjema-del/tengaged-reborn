<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">

  <title>Prueba de Inmunidad · Tengaged Reborn</title>

  <style>
    body{
      font-family:Arial,sans-serif;
      margin:0;
      background:#eaf5fb;
      color:#285274;
    }

    .wrap{
      max-width:900px;
      margin:auto;
      padding:20px;
    }

    .head{
      background:white;
      border-radius:14px;
      padding:18px;
      margin-bottom:18px;
      box-shadow:0 3px 12px rgba(0,0,0,.08);
    }

    .head h1{
      margin:0 0 6px;
    }

    .card{
      background:white;
      border-radius:14px;
      padding:25px;
      margin-bottom:18px;
      box-shadow:0 3px 12px rgba(0,0,0,.08);
    }

    .status{
      padding:14px;
      border-radius:10px;
      background:#f1f7fa;
      margin:15px 0;
      text-align:center;
      font-weight:bold;
    }

    button{
      border:0;
      border-radius:10px;
      padding:14px 20px;
      font-size:17px;
      font-weight:bold;
      cursor:pointer;
    }

    #startBtn{
      background:#285274;
      color:white;
    }

    #reactionBtn{
      display:none;
      width:100%;
      min-height:160px;
      background:#d9534f;
      color:white;
      font-size:28px;
    }

    #reactionBtn.green{
      background:#24a148;
    }

    .result{
      text-align:center;
      padding:20px;
      background:#eef9f0;
      border-radius:12px;
      margin-top:18px;
    }

    .time{
      font-size:42px;
      font-weight:bold;
      margin:10px 0;
      color:#285274;
    }

    .ranking{
      margin-top:20px;
    }

    .rank{
      display:flex;
      align-items:center;
      justify-content:space-between;
      padding:12px 14px;
      border-bottom:1px solid #e5e5e5;
      gap:10px;
    }

    .rank:last-child{
      border-bottom:0;
    }

    .rank strong{
      min-width:45px;
    }

    .rank-time{
      font-weight:bold;
    }

    .pending{
      color:#777;
    }

    .winner{
      background:#fff7d6;
      border-radius:10px;
      margin-bottom:8px;
    }

    .error{
      background:#ffe8e8;
      color:#a00000;
      padding:12px;
      border-radius:10px;
      margin-top:15px;
    }

    .success{
      background:#e8f8ec;
      color:#176b2c;
      padding:12px;
      border-radius:10px;
      margin-top:15px;
    }

    .small{
      color:#6d7f8a;
      font-size:14px;
    }
  </style>
</head>

<body>

<div class="wrap">

  <div class="head">
    <h1>🎮 Tengaged Reborn</h1>
    <div>
      Jugador: <strong id="username">admin1</strong>
    </div>
  </div>

  <div class="card">

    <h2>🏆 Prueba de Inmunidad</h2>

    <p>
      Casting #1 · Primera prueba de la partida
    </p>

    <div id="status" class="status">
      ⚡ Prepárate...
      <br>
      <span class="small">
        Pulsa «Comenzar prueba» y espera.
        Cuando el botón verde aparezca, pulsa lo más rápido posible.
      </span>
    </div>

    <button id="startBtn">
      ⚡ Comenzar prueba
    </button>

    <button id="reactionBtn">
      ESPERA...
    </button>

    <div id="message"></div>

    <div id="result"></div>

  </div>

  <div class="card">

    <h2>🏅 Clasificación</h2>

    <div id="ranking">
      Cargando clasificación...
    </div>

  </div>

</div>

<script>

const username =
  localStorage.getItem("username") ||
  localStorage.getItem("currentUser") ||
  "admin1";

document.getElementById("username").textContent = username;

const startBtn = document.getElementById("startBtn");
const reactionBtn = document.getElementById("reactionBtn");
const statusBox = document.getElementById("status");
const messageBox = document.getElementById("message");
const resultBox = document.getElementById("result");
const rankingBox = document.getElementById("ranking");

let reactionStart = null;
let waiting = false;
let finished = false;
let timer = null;


/* ==========================================
   COMPROBAR ESTADO
========================================== */

async function loadGame(){

  try{

    const response = await fetch("/api/game", {
      method:"GET",
      cache:"no-store"
    });

    const data = await response.json();

    if(!response.ok || !data.ok){

      messageBox.innerHTML =
        `<div class="error">
          ${data.message || "No se pudo cargar la partida."}
        </div>`;

      return;
    }

    renderRanking(data);

    const myResult =
      (data.ranking || []).find(
        p => String(p.username).toLowerCase() ===
             String(username).toLowerCase()
      );

    if(myResult){

      finished = true;

      startBtn.style.display = "none";
      reactionBtn.style.display = "none";

      statusBox.innerHTML =
        "✅ Prueba completada";

      resultBox.innerHTML = `
        <div class="result">
          <div>Tu tiempo</div>
          <div class="time">
            ${myResult.reaction_ms} ms
          </div>
          <div>
            Tu tiempo ha quedado registrado.
          </div>
        </div>
      `;

      return;
    }

  }catch(error){

    messageBox.innerHTML =
      `<div class="error">
        Error conectando con la partida.
      </div>`;
  }
}


/* ==========================================
   COMENZAR PRUEBA
========================================== */

startBtn.addEventListener("click", () => {

  if(finished || waiting){
    return;
  }

  messageBox.innerHTML = "";
  resultBox.innerHTML = "";

  startBtn.style.display = "none";

  reactionBtn.style.display = "block";
  reactionBtn.classList.remove("green");

  reactionBtn.disabled = false;
  reactionBtn.textContent = "ESPERA...";

  waiting = true;
  reactionStart = null;

  statusBox.innerHTML =
    "⚡ Espera al botón verde...";

  const delay =
    Math.floor(Math.random() * 3500) + 1500;

  timer = setTimeout(() => {

    reactionStart = performance.now();

    reactionBtn.classList.add("green");
    reactionBtn.textContent = "🟢 ¡PULSA AHORA!";

    statusBox.innerHTML =
      "🟢 ¡AHORA!";

  }, delay);
});


/* ==========================================
   BOTÓN DE REACCIÓN
========================================== */

reactionBtn.addEventListener("click", async () => {

  if(!waiting || finished){
    return;
  }

  // Pulsó demasiado pronto
  if(!reactionStart){

    clearTimeout(timer);

    waiting = false;

    reactionBtn.style.display = "none";
    startBtn.style.display = "inline-block";

    statusBox.innerHTML =
      "❌ ¡Demasiado pronto!";

    messageBox.innerHTML =
      `<div class="error">
        Has pulsado antes de que apareciera el verde.
        Inténtalo otra vez.
      </div>`;

    return;
  }

  const reactionMs =
    Math.round(performance.now() - reactionStart);

  waiting = false;
  finished = true;

  reactionBtn.disabled = true;

  statusBox.innerHTML =
    "⏳ Guardando tu tiempo...";

  reactionBtn.textContent =
    reactionMs + " ms";


  /* ========================================
     GUARDAR EN D1
  ======================================== */

  try{

    const response = await fetch("/api/game", {

      method:"POST",

      headers:{
        "Content-Type":"application/json"
      },

      body:JSON.stringify({

        username:username,

        reaction_ms:reactionMs

      })

    });


    const data = await response.json();


    if(!response.ok || !data.ok){

      finished = false;

      reactionBtn.disabled = false;
      reactionBtn.style.display = "none";
      startBtn.style.display = "inline-block";

      statusBox.innerHTML =
        "❌ No se ha podido guardar";

      messageBox.innerHTML =
        `<div class="error">
          ${data.message || "Error guardando el tiempo."}
        </div>`;

      return;
    }


    /* ======================================
       GUARDADO CORRECTO
    ====================================== */

    statusBox.innerHTML =
      "✅ Prueba completada";

    messageBox.innerHTML =
      `<div class="success">
        Tu tiempo ha quedado registrado correctamente.
      </div>`;

    resultBox.innerHTML = `
      <div class="result">
        <div>⏱️ Tu tiempo</div>

        <div class="time">
          ${reactionMs} ms
        </div>

        <div>
          Tiempo registrado correctamente.
        </div>
      </div>
    `;


    renderRanking(data);


  }catch(error){

    finished = false;

    reactionBtn.disabled = false;
    reactionBtn.style.display = "none";
    startBtn.style.display = "inline-block";

    statusBox.innerHTML =
      "❌ Error de conexión";

    messageBox.innerHTML =
      `<div class="error">
        No se pudo contactar con el servidor.
        <br>
        ${error.message}
      </div>`;
  }

});


/* ==========================================
   MOSTRAR CLASIFICACIÓN
========================================== */

function renderRanking(data){

  const ranking = data.ranking || [];
  const pending = data.pending || [];

  let html = "";

  if(ranking.length === 0){

    html += `
      <div class="small">
        Todavía nadie ha completado la prueba.
      </div>
    `;

  }else{

    ranking.forEach(player => {

      let medal = "";

      if(player.position === 1){
        medal = "🥇";
      }else if(player.position === 2){
        medal = "🥈";
      }else if(player.position === 3){
        medal = "🥉";
      }else{
        medal = player.position + "º";
      }

      const winnerClass =
        player.position === 1
          ? "winner"
          : "";

      html += `
        <div class="rank ${winnerClass}">

          <strong>
            ${medal}
          </strong>

          <span>
            ${escapeHtml(player.username)}
          </span>

          <span class="rank-time">
            ${player.reaction_ms} ms
          </span>

        </div>
      `;

    });

  }


  if(pending.length > 0){

    html += `
      <div style="margin-top:18px">
        <strong>⏳ Pendientes</strong>
      </div>
    `;

    pending.forEach(player => {

      html += `
        <div class="rank pending">

          <strong>⏳</strong>

          <span>
            ${escapeHtml(player.username)}
          </span>

          <span>
            Pendiente
          </span>

        </div>
      `;

    });

  }


  if(data.finished){

    html += `
      <div class="success" style="margin-top:18px">
        🏆 Todos los jugadores han completado la prueba.
      </div>
    `;

  }


  rankingBox.innerHTML = html;
}


/* ==========================================
   SEGURIDAD PARA NOMBRES
========================================== */

function escapeHtml(value){

  return String(value)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}


/* ==========================================
   ACTUALIZACIÓN AUTOMÁTICA
========================================== */

loadGame();

setInterval(() => {

  if(!waiting){
    loadGame();
  }

},5000);

</script>

</body>
</html>
