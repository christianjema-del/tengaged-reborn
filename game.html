<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Tengaged Reborn - Partida</title>

<style>

body{
  font-family:Arial,sans-serif;
  margin:0;
  background:#eaf5fb;
  color:#285274;
}

.wrap{
  max-width:1000px;
  margin:auto;
  padding:20px;
}

.card{
  background:white;
  border-radius:14px;
  padding:22px;
  margin-bottom:18px;
  box-shadow:0 4px 14px rgba(0,0,0,.08);
}

h1,h2,h3{
  margin-top:0;
}

.center{
  text-align:center;
}

.badge{
  display:inline-block;
  padding:7px 12px;
  border-radius:20px;
  background:#dff1ff;
  margin-bottom:12px;
  font-weight:bold;
}

button{
  border:0;
  border-radius:10px;
  padding:13px 20px;
  font-size:16px;
  cursor:pointer;
  background:#2878b8;
  color:white;
}

button:hover{
  opacity:.9;
}

button:disabled{
  opacity:.5;
  cursor:not-allowed;
}

.reaction{
  width:100%;
  min-height:170px;
  font-size:28px;
  font-weight:bold;
  background:#2878b8;
  margin-top:20px;
}

.reaction.waiting{
  background:#e7edf2;
  color:#285274;
}

.reaction.ready{
  background:#39a852;
  color:white;
}

.reaction.false{
  background:#d9534f;
  color:white;
}

.hidden{
  display:none;
}

.status{
  padding:12px;
  border-radius:10px;
  background:#f0f7fb;
  margin:12px 0;
}

.success{
  background:#e4f8e8;
  border:1px solid #9bd5a4;
}

.warning{
  background:#fff5d9;
  border:1px solid #ead18b;
}

.danger{
  background:#fde7e7;
  border:1px solid #e3a0a0;
}

.winner{
  text-align:center;
  background:#fff4c7;
  border:2px solid #e3bf42;
  padding:24px;
  border-radius:14px;
}

.winner .name{
  font-size:28px;
  font-weight:bold;
  margin:10px 0;
}

.winner .time{
  font-size:20px;
}

table{
  width:100%;
  border-collapse:collapse;
}

th,td{
  padding:10px;
  border-bottom:1px solid #ddd;
  text-align:left;
}

th{
  background:#f0f6fa;
}

.position{
  font-weight:bold;
}

.vote-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
  gap:12px;
  margin-top:18px;
}

.vote-player{
  background:#f5f9fc;
  border:2px solid #d5e5ef;
  border-radius:12px;
  padding:16px;
  cursor:pointer;
  text-align:center;
  transition:.15s;
}

.vote-player:hover{
  border-color:#2878b8;
  background:#edf7ff;
}

.vote-player.selected{
  border-color:#2878b8;
  background:#dff1ff;
}

.vote-player.immune{
  opacity:.5;
  cursor:not-allowed;
  border-color:#e3bf42;
  background:#fff8da;
}

.vote-name{
  font-size:18px;
  font-weight:bold;
}

.vote-note{
  font-size:13px;
  margin-top:6px;
}

.nominee{
  background:#ffe4e4;
  border:2px solid #d9534f;
  border-radius:10px;
  padding:14px;
  margin-top:10px;
  font-weight:bold;
}

.small{
  font-size:13px;
  color:#668096;
}

</style>
</head>

<body>

<div class="wrap">

  <div class="card center">

    <div class="badge">
      🎮 Tengaged Reborn
    </div>

    <h1 id="title">
      Cargando partida...
    </h1>

    <div id="phaseText">
      Conectando con el servidor...
    </div>

  </div>


  <!-- =====================================================
       INMUNIDAD
       ===================================================== -->

  <div id="immunitySection">

    <div class="card">

      <h2>🏆 Prueba de Inmunidad</h2>

      <p>
        Cuando aparezca <b>¡AHORA!</b>, pulsa el botón
        lo más rápido posible.
      </p>

      <div id="immunityStatus"
           class="status">
        Preparando prueba...
      </div>

      <button
        id="startButton"
        onclick="startReaction()">
        ▶️ Comenzar prueba
      </button>

      <button
        id="reactionButton"
        class="reaction hidden"
        onclick="react()">
        ESPERA...
      </button>

      <div id="reactionResult"
           class="status hidden">
      </div>

    </div>


    <div class="card">

      <h2>🏅 Clasificación</h2>

      <div id="ranking">
        Cargando...
      </div>

    </div>


    <div class="card">

      <h2>⏳ Pendientes</h2>

      <div id="pending">
        Cargando...
      </div>

    </div>

  </div>


  <!-- =====================================================
       GANADOR INMUNIDAD
       ===================================================== -->

  <div id="immunityWinnerSection"
       class="card hidden">

    <div id="immunityWinner">
    </div>

  </div>


  <!-- =====================================================
       NOMINACIONES
       ===================================================== -->

  <div id="nominationsSection"
       class="hidden">

    <div class="card">

      <h2>🗳️ Nominaciones</h2>

      <div id="nominationInfo"
           class="status">
      </div>

      <div id="voteArea">
      </div>

    </div>


    <div class="card">

      <h2>📊 Votos</h2>

      <div id="voteRanking">
        Todavía no hay votos.
      </div>

    </div>


    <div id="nomineesCard"
         class="card hidden">

      <h2>🚨 Nominados</h2>

      <div id="nominees">
      </div>

    </div>

  </div>


</div>


<script>

let username =
  localStorage.getItem("username") ||
  localStorage.getItem("currentUser") ||
  "admin1";

let reactionTimer = null;
let reactionStart = null;
let canReact = false;
let selectedVote = null;
let alreadyVoted = false;


// =========================================================
// ESCAPAR HTML
// =========================================================

function escapeHtml(value){

  return String(value ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}


// =========================================================
// CARGAR DATOS
// =========================================================

async function loadGame(){

  try{

    const response =
      await fetch("/api/game");

    const data =
      await response.json();

    if(!response.ok || !data.ok){

      document.getElementById("title")
        .textContent =
        "Error";

      document.getElementById("phaseText")
        .textContent =
        data.message ||
        "No se pudo cargar la partida.";

      return;
    }

    renderGame(data);

  }catch(error){

    document.getElementById("title")
      .textContent =
      "Error de conexión";

    document.getElementById("phaseText")
      .textContent =
      "No se pudo conectar con el servidor.";
  }

}


// =========================================================
// RENDER GENERAL
// =========================================================

function renderGame(data){

  if(data.phase === "immunity"){

    renderImmunity(data);

    return;
  }

  if(data.phase === "nominations"){

    renderNominations(data);

    return;
  }

}


// =========================================================
// INMUNIDAD
// =========================================================

function renderImmunity(data){

  document.getElementById("title")
    .textContent =
    "🏆 Prueba de Inmunidad";

  document.getElementById("phaseText")
    .textContent =
    "Todos los jugadores deben completar la prueba.";

  document.getElementById("immunitySection")
    .classList.remove("hidden");

  document.getElementById("nominationsSection")
    .classList.add("hidden");


  // GANADOR SI EXISTE

  if(data.winner){

    document.getElementById(
      "immunityWinnerSection"
    ).classList.remove("hidden");

    document.getElementById(
      "immunityWinner"
    ).innerHTML = `

      <div class="winner">

        <div>
          🏆 INMUNIDAD CONSEGUIDA
        </div>

        <div class="name">
          ${escapeHtml(data.winner.username)}
        </div>

        <div class="time">
          Tiempo ganador:
          <b>${data.winner.reaction_ms} ms</b>
        </div>

      </div>
    `;
  }


  renderRanking(data);
  renderPending(data);

}


// =========================================================
// CLASIFICACIÓN
// =========================================================

function renderRanking(data){

  const container =
    document.getElementById("ranking");

  if(!data.ranking ||
     data.ranking.length === 0){

    container.innerHTML =
      "<div class='small'>Todavía no hay tiempos registrados.</div>";

    return;
  }

  let html = `
    <table>

      <thead>
        <tr>
          <th>#</th>
          <th>Jugador</th>
          <th>Tiempo</th>
        </tr>
      </thead>

      <tbody>
  `;

  data.ranking.forEach(player => {

    html += `

      <tr>

        <td class="position">
          ${player.position}
        </td>

        <td>
          ${escapeHtml(player.username)}
        </td>

        <td>
          ${player.reaction_ms} ms
        </td>

      </tr>
    `;

  });

  html += `
      </tbody>
    </table>
  `;

  container.innerHTML = html;

}


// =========================================================
// PENDIENTES
// =========================================================

function renderPending(data){

  const container =
    document.getElementById("pending");

  if(!data.pending ||
     data.pending.length === 0){

    container.innerHTML =
      `
      <div class="status success">
        ✅ Todos han completado la prueba.
      </div>
      `;

    return;
  }

  container.innerHTML =
    data.pending
      .map(player => `
        <div class="status">
          ⏳ ${escapeHtml(player.username)}
        </div>
      `)
      .join("");

}


// =========================================================
// COMENZAR REACCIÓN
// =========================================================

function startReaction(){

  const startButton =
    document.getElementById("startButton");

  const reactionButton =
    document.getElementById("reactionButton");

  const status =
    document.getElementById("immunityStatus");

  const result =
    document.getElementById("reactionResult");


  startButton.disabled = true;

  result.classList.add("hidden");

  reactionButton.className =
    "reaction";

  reactionButton.textContent =
    "ESPERA...";

  reactionButton.classList.remove(
    "hidden"
  );

  canReact = false;

  status.textContent =
    "⏳ Espera...";


  const delay =
    1500 +
    Math.random() * 3500;


  reactionTimer =
    setTimeout(() => {

      canReact = true;

      reactionStart =
        performance.now();

      reactionButton.className =
        "reaction ready";

      reactionButton.textContent =
        "🚨 ¡AHORA!";

      status.textContent =
        "🔥 ¡PULSA AHORA!";

    },delay);

}


// =========================================================
// REACCIÓN
// =========================================================

async function react(){

  const reactionButton =
    document.getElementById("reactionButton");

  const status =
    document.getElementById("immunityStatus");

  const result =
    document.getElementById("reactionResult");


  // FALSA SALIDA

  if(!canReact){

    clearTimeout(reactionTimer);

    reactionButton.className =
      "reaction false";

    reactionButton.textContent =
      "❌ SALIDA FALSA";

    status.textContent =
      "Has pulsado demasiado pronto.";

    result.className =
      "status danger";

    result.textContent =
      "❌ No se registra ningún tiempo. Puedes volver a intentarlo.";

    result.classList.remove("hidden");

    document.getElementById("startButton")
      .disabled = false;

    return;
  }


  canReact = false;


  const reactionMs =
    Math.round(
      performance.now() -
      reactionStart
    );


  reactionButton.disabled = true;

  reactionButton.textContent =
    reactionMs + " ms";

  status.textContent =
    "💾 Guardando resultado...";


  try{

    const response =
      await fetch("/api/game",{

        method:"POST",

        headers:{
          "Content-Type":
            "application/json"
        },

        body:JSON.stringify({

          username:username,

          reaction_ms:reactionMs

        })

      });


    const data =
      await response.json();


    if(!response.ok || !data.ok){

      result.className =
        "status danger";

      result.textContent =
        data.message ||
        "No se pudo guardar.";

      result.classList.remove(
        "hidden"
      );

      reactionButton.disabled =
        false;

      return;
    }


    result.className =
      "status success";

    result.textContent =
      data.message ||
      "¡Tiempo registrado!";

    result.classList.remove(
      "hidden"
    );


    // Si ya terminó inmunidad,
    // renderizamos inmediatamente
    // las nominaciones.

    if(data.phase === "nominations"){

      setTimeout(() => {

        renderGame(data);

      },800);

      return;
    }


    reactionButton.classList.add(
      "waiting"
    );


    loadGame();

  }catch(error){

    result.className =
      "status danger";

    result.textContent =
      "Error de conexión.";

    result.classList.remove(
      "hidden"
    );

    reactionButton.disabled =
      false;
  }

}


// =========================================================
// NOMINACIONES
// =========================================================

function renderNominations(data){

  document.getElementById("title")
    .textContent =
    "🗳️ Fase de Nominaciones";

  document.getElementById("phaseText")
    .textContent =
    "Cada jugador debe emitir un voto.";


  document.getElementById("immunitySection")
    .classList.add("hidden");


  document.getElementById(
    "immunityWinnerSection"
  ).classList.remove("hidden");


  if(data.winner){

    document.getElementById(
      "immunityWinner"
    ).innerHTML = `

      <div class="winner">

        <div>
          🛡️ JUGADOR INMUNE
        </div>

        <div class="name">
          ${escapeHtml(data.winner.username)}
        </div>

        <div class="time">
          Tiene inmunidad y no puede ser nominado.
        </div>

      </div>

    `;
  }


  document.getElementById(
    "nominationsSection"
  ).classList.remove("hidden");


  renderNominationInfo(data);

  renderVoteArea(data);

  renderVoteRanking(data);

  renderNominees(data);

}


// =========================================================
// INFORMACIÓN DE VOTACIÓN
// =========================================================

function renderNominationInfo(data){

  const info =
    document.getElementById(
      "nominationInfo"
    );


  if(data.status === "finished"){

    info.className =
      "status success";

    info.innerHTML =
      `
      🗳️ <b>Votación cerrada.</b><br>
      Todos los jugadores han votado.
      `;

    return;
  }


  info.className =
    "status";

  info.innerHTML = `

    🗳️ Votos registrados:
    <b>${data.totalVotes}</b>
    /
    <b>${data.totalPlayers}</b>

    <br><br>

    ⏳ Pendientes:
    <b>${data.pendingVotes.length}</b>

  `;

}


// =========================================================
// ÁREA PARA VOTAR
// =========================================================

function renderVoteArea(data){

  const area =
    document.getElementById(
      "voteArea"
    );


  if(data.status === "finished"){

    area.innerHTML = `

      <div class="status success">

        ✅ La votación ha terminado.

        <br><br>

        Ya no se pueden emitir más votos.

      </div>
    `;

    return;
  }


  const currentVote =
    data.votes.find(
      vote =>
        vote.username.toLowerCase() ===
        username.toLowerCase()
    );


  if(currentVote){

    alreadyVoted = true;

    area.innerHTML = `

      <div class="status success">

        ✅ Ya has votado.

        <br><br>

        Tu voto ha sido registrado.

      </div>

    `;

    return;
  }


  alreadyVoted = false;


  let html = `

    <p>
      Selecciona al jugador que quieres nominar:
    </p>

    <div class="vote-grid">
  `;


  data.players.forEach(player => {

    const isImmune =
      data.winner &&
      player.username.toLowerCase() ===
      data.winner.username.toLowerCase();


    if(isImmune){

      html += `

        <div class="vote-player immune">

          <div class="vote-name">
            🛡️ ${escapeHtml(player.username)}
          </div>

          <div class="vote-note">
            Inmune
          </div>

        </div>
      `;

      return;
    }


    html += `

      <div
        class="vote-player"
        id="vote-${escapeHtml(player.username)}"
        onclick="selectVote('${escapeHtml(player.username)}')">

        <div class="vote-name">
          ${escapeHtml(player.username)}
        </div>

        <div class="vote-note">
          🗳️ Nominar
        </div>

      </div>
    `;

  });


  html += `
    </div>

    <div style="margin-top:20px">

      <button
        id="submitVoteButton"
        disabled
        onclick="submitVote()">

        🗳️ Confirmar nominación

      </button>

    </div>
  `;


  area.innerHTML = html;

}


// =========================================================
// SELECCIONAR VOTO
// =========================================================

function selectVote(target){

  if(alreadyVoted){
    return;
  }


  selectedVote =
    target;


  document
    .querySelectorAll(".vote-player")
    .forEach(element => {

      element.classList.remove(
        "selected"
      );

    });


  const selected =
    document.getElementById(
      "vote-" + target
    );


  if(selected){

    selected.classList.add(
      "selected"
    );
  }


  const button =
    document.getElementById(
      "submitVoteButton"
    );


  if(button){

    button.disabled =
      false;
  }

}


// =========================================================
// ENVIAR VOTO
// =========================================================

async function submitVote(){

  if(!selectedVote ||
     alreadyVoted){

    return;
  }


  const button =
    document.getElementById(
      "submitVoteButton"
    );


  button.disabled =
    true;

  button.textContent =
    "💾 Guardando voto...";


  try{

    const response =
      await fetch("/api/game",{

        method:"POST",

        headers:{
          "Content-Type":
            "application/json"
        },

        body:JSON.stringify({

          username:username,

          vote_target:selectedVote

        })

      });


    const data =
      await response.json();


    if(!response.ok || !data.ok){

      alert(
        data.message ||
        "No se pudo registrar el voto."
      );

      button.disabled =
        false;

      button.textContent =
        "🗳️ Confirmar nominación";

      return;
    }


    selectedVote =
      null;

    alreadyVoted =
      true;


    renderGame(data);

  }catch(error){

    alert(
      "Error de conexión."
    );

    button.disabled =
      false;

    button.textContent =
      "🗳️ Confirmar nominación";
  }

}


// =========================================================
// CLASIFICACIÓN DE VOTOS
// =========================================================

function renderVoteRanking(data){

  const container =
    document.getElementById(
      "voteRanking"
    );


  if(!data.voteRanking ||
     data.voteRanking.length === 0){

    container.innerHTML =
      `
      <div class="small">
        Todavía no hay votos registrados.
      </div>
      `;

    return;
  }


  let html = `

    <table>

      <thead>

        <tr>
          <th>Jugador</th>
          <th>Votos</th>
        </tr>

      </thead>

      <tbody>
  `;


  data.voteRanking.forEach(player => {

    html += `

      <tr>

        <td>
          ${escapeHtml(player.username)}
        </td>

        <td>
          <b>${player.votes}</b>
        </td>

      </tr>

    `;

  });


  html += `

      </tbody>

    </table>
  `;


  container.innerHTML =
    html;

}


// =========================================================
// NOMINADOS
// =========================================================

function renderNominees(data){

  const card =
    document.getElementById(
      "nomineesCard"
    );

  const container =
    document.getElementById(
      "nominees"
    );


  if(
    data.status !== "finished" ||
    !data.nominees ||
    data.nominees.length === 0
  ){

    card.classList.add(
      "hidden"
    );

    return;
  }


  card.classList.remove(
    "hidden"
  );


  let html = `

    <div class="status danger">

      🚨 La votación ha terminado.

      <br>

      Los siguientes jugadores quedan nominados:

    </div>
  `;


  data.nominees.forEach(player => {

    html += `

      <div class="nominee">

        🚨 ${escapeHtml(player.username)}

        <br>

        <span class="small">
          ${player.votes} voto(s)
        </span>

      </div>

    `;

  });


  container.innerHTML =
    html;

}


// =========================================================
// ACTUALIZACIÓN AUTOMÁTICA
// =========================================================

setInterval(() => {

  loadGame();

},5000);


// =========================================================
// INICIO
// =========================================================

loadGame();

</script>

</body>
</html>
