<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tengaged Reborn</title>

<style>
*{
  box-sizing:border-box;
}

body{
  font-family:Arial,sans-serif;
  margin:0;
  background:#eaf5fb;
  color:#285274;
}

.wrap{
  max-width:1000px;
  margin:auto;
  padding:18px;
}

.head,
.card{
  background:#fff;
  border:1px solid #bfd8e8;
  border-radius:12px;
  padding:18px;
  margin-bottom:18px;
  box-shadow:0 2px 8px rgba(0,0,0,.06);
}

.head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
}

.logo{
  font-size:28px;
  font-weight:bold;
  color:#24658d;
}

.logo span{
  font-weight:normal;
}

.logo b{
  color:#ef8b2c;
}

.user-area{
  text-align:right;
}

.user-name{
  font-weight:bold;
  color:#24658d;
}

.hidden{
  display:none !important;
}

h1,h2,h3{
  margin-top:0;
}

button{
  border:0;
  border-radius:8px;
  padding:10px 16px;
  background:#287bb1;
  color:white;
  cursor:pointer;
  font-weight:bold;
  margin:4px;
}

button:hover{
  background:#1f638f;
}

button.secondary{
  background:#7c98aa;
}

button.danger{
  background:#c94c4c;
}

input{
  width:100%;
  padding:11px;
  margin:6px 0;
  border:1px solid #bfd8e8;
  border-radius:7px;
  font-size:15px;
}

.cast{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:10px;
  margin:15px 0;
}

.player{
  background:#f3f9fc;
  border:1px solid #c9dfe9;
  border-radius:8px;
  padding:12px;
  text-align:center;
}

.avatar{
  font-size:25px;
  margin-bottom:5px;
}

.msg{
  margin-top:10px;
  padding:10px;
  border-radius:7px;
  background:#eef7fb;
}

.actions{
  display:flex;
  flex-wrap:wrap;
  gap:5px;
}

.activity{
  background:#f7fbfd;
  border-left:4px solid #287bb1;
  padding:12px;
  margin-top:10px;
}

@media(max-width:700px){
  .head{
    flex-direction:column;
    align-items:flex-start;
  }

  .user-area{
    text-align:left;
  }

  .cast{
    grid-template-columns:repeat(2,1fr);
  }
}

@media(max-width:450px){
  .cast{
    grid-template-columns:1fr;
  }
}
</style>
</head>

<body>

<div class="wrap">

<header class="head">

  <div class="logo">
    tengaged<span><b>.es</b> reborn</span>
  </div>

  <div id="guestBox" class="user-area">

    <div>Invitado</div>

    <button onclick="showLogin()">
      Entrar
    </button>

    <button onclick="showRegister()">
      Crear cuenta
    </button>

  </div>


  <div id="userBox" class="user-area hidden">

    <div>Conectado como</div>

    <div id="loggedUsername" class="user-name"></div>

    <div class="actions">

      <button onclick="showProfile()">
        Mi perfil
      </button>

      <button class="danger" onclick="logout()">
        Cerrar sesión
      </button>

    </div>

  </div>

</header>


<!-- CUENTA -->

<section id="accountBox" class="card">

<h2>Cuenta</h2>


<div id="loginPanel">

<h3>Iniciar sesión</h3>

<input
id="loginUsername"
type="text"
placeholder="Usuario"
autocomplete="username"
>

<input
id="loginPassword"
type="password"
placeholder="Contraseña"
autocomplete="current-password"
>

<button onclick="login()">
Entrar
</button>

<button
class="secondary"
onclick="showRegister()"
>
Crear cuenta
</button>

<div id="loginMsg" class="msg"></div>

</div>


<div id="registerPanel" class="hidden">

<h3>Crear cuenta</h3>

<input
id="registerUsername"
type="text"
placeholder="Usuario"
autocomplete="username"
>

<input
id="registerEmail"
type="email"
placeholder="Email"
autocomplete="email"
>

<input
id="registerPassword"
type="password"
placeholder="Contraseña (8+ caracteres)"
autocomplete="new-password"
>

<button onclick="register()">
Registrarme
</button>

<button
class="secondary"
onclick="showLogin()"
>
Ya tengo cuenta
</button>

<div id="registerMsg" class="msg"></div>

</div>

</section>


<!-- PERFIL -->

<section id="profileBox" class="card hidden">

<h2>Mi perfil</h2>

<p>
Usuario:
<strong id="profileUsername"></strong>
</p>

<div class="activity">
🎮 Tu actividad aparecerá aquí.
</div>

</section>


<!-- CASTING -->

<section class="card">

<h2>🎮 Castings</h2>

<h3>Casting #1</h3>

<p>
Únete a la primera partida de Tengaged Reborn.
</p>

<div id="castingPlayers" class="cast"></div>

<button onclick="joinCasting()">
Entrar al Casting
</button>

<div id="castingMsg" class="msg"></div>

</section>


<!-- ACTIVIDAD -->

<section class="card">

<h2>📢 Actividad</h2>

<div class="activity">
🎮 Bienvenido a Tengaged Reborn.
</div>

<div class="activity">
🏆 El primer casting está abierto.
</div>

<div id="userActivity" class="activity hidden"></div>

</section>

</div>


<script>

/* =========================
   ELEMENTOS
========================= */

const guestBox =
document.getElementById("guestBox");

const userBox =
document.getElementById("userBox");

const accountBox =
document.getElementById("accountBox");

const loginPanel =
document.getElementById("loginPanel");

const registerPanel =
document.getElementById("registerPanel");

const loginMsg =
document.getElementById("loginMsg");

const registerMsg =
document.getElementById("registerMsg");

const profileBox =
document.getElementById("profileBox");

const loggedUsername =
document.getElementById("loggedUsername");

const profileUsername =
document.getElementById("profileUsername");

const castingMsg =
document.getElementById("castingMsg");

const castingPlayers =
document.getElementById("castingPlayers");

const userActivity =
document.getElementById("userActivity");


/* =========================
   JUGADORES DEL CASTING
========================= */

let castingPlayersList = [

"Lauu",
"Alex99",
"Saray",
"Rubenito",
"Nerea",
"Yaihiaaa",
"javix",
"ana95"

];


/* =========================
   MOSTRAR JUGADORES
========================= */

function renderCasting(){

  castingPlayers.innerHTML = "";

  castingPlayersList.forEach(function(username){

    const player =
    document.createElement("div");

    player.className="player";

    player.innerHTML =
      '<div class="avatar">🙂</div>' +
      '<b>' +
      username +
      '</b>';

    castingPlayers.appendChild(player);

  });

}


/* =========================
   LOGIN
========================= */

function showLogin(){

  accountBox.classList.remove("hidden");

  loginPanel.classList.remove("hidden");

  registerPanel.classList.add("hidden");

  loginMsg.textContent="";

  registerMsg.textContent="";

  window.scrollTo({
    top:accountBox.offsetTop - 20,
    behavior:"smooth"
  });

}


/* =========================
   REGISTRO
========================= */

function showRegister(){

  accountBox.classList.remove("hidden");

  loginPanel.classList.add("hidden");

  registerPanel.classList.remove("hidden");

  loginMsg.textContent="";

  registerMsg.textContent="";

  window.scrollTo({
    top:accountBox.offsetTop - 20,
    behavior:"smooth"
  });

}


/* =========================
   MOSTRAR USUARIO
========================= */

function showLoggedUser(username){

  if(!username){
    return;
  }

  guestBox.classList.add("hidden");

  userBox.classList.remove("hidden");

  loggedUsername.textContent=username;

  profileUsername.textContent=username;

  accountBox.classList.add("hidden");

  userActivity.classList.remove("hidden");

  userActivity.textContent =
    "👋 Bienvenido, " +
    username +
    ". Has iniciado sesión correctamente.";

}


/* =========================
   LOGIN
========================= */

async function login(){

  const username =
    document
    .getElementById("loginUsername")
    .value
    .trim();

  const password =
    document
    .getElementById("loginPassword")
    .value;

  loginMsg.textContent =
    "Iniciando sesión...";


  if(!username || !password){

    loginMsg.textContent =
      "⚠️ Introduce usuario y contraseña.";

    return;

  }


  try{

    const response =
    await fetch("/api/login",{

      method:"POST",

      headers:{
        "Content-Type":"application/json"
      },

      credentials:"include",

      body:JSON.stringify({

        username:username,
        password:password

      })

    });


    const data =
    await response.json();


    if(!response.ok){

      loginMsg.textContent =
        "❌ " +
        (
          data.error ||
          data.message ||
          "No se pudo iniciar sesión."
        );

      return;

    }


    if(data.user){

      localStorage.setItem(
        "tengaged_user",
        data.user.username
      );

      showLoggedUser(
        data.user.username
      );

      loginMsg.textContent="";

    }


  }catch(error){

    console.error(error);

    loginMsg.textContent =
      "❌ Error de conexión con el servidor.";

  }

}


/* =========================
   REGISTRO
========================= */

async function register(){

  const username =
    document
    .getElementById("registerUsername")
    .value
    .trim();

  const email =
    document
    .getElementById("registerEmail")
    .value
    .trim();

  const password =
    document
    .getElementById("registerPassword")
    .value;


  registerMsg.textContent =
    "Creando cuenta...";


  if(!username || !email || !password){

    registerMsg.textContent =
      "⚠️ Completa todos los campos.";

    return;

  }


  if(password.length < 8){

    registerMsg.textContent =
      "⚠️ La contraseña debe tener al menos 8 caracteres.";

    return;

  }


  try{

    const response =
    await fetch("/api/register",{

      method:"POST",

      headers:{
        "Content-Type":"application/json"
      },

      credentials:"include",

      body:JSON.stringify({

        username:username,
        email:email,
        password:password

      })

    });


    const data =
    await response.json();


    if(!response.ok){

      registerMsg.textContent =
        "❌ " +
        (
          data.error ||
          data.message ||
          "No se pudo crear la cuenta."
        );

      return;

    }


    registerMsg.textContent =
      "✅ Cuenta creada correctamente. Ahora puedes iniciar sesión.";


    document.getElementById(
      "registerUsername"
    ).value="";


    document.getElementById(
      "registerEmail"
    ).value="";


    document.getElementById(
      "registerPassword"
    ).value="";


  }catch(error){

    console.error(error);

    registerMsg.textContent =
      "❌ Error de conexión con el servidor.";

  }

}


/* =========================
   CERRAR SESIÓN
========================= */

function logout(){

  localStorage.removeItem(
    "tengaged_user"
  );

  guestBox.classList.remove("hidden");

  userBox.classList.add("hidden");

  profileBox.classList.add("hidden");

  accountBox.classList.remove("hidden");

  castingMsg.textContent="";

  userActivity.classList.add("hidden");

  showLogin();

}


/* =========================
   PERFIL
========================= */

function showProfile(){

  const username =
    localStorage.getItem(
      "tengaged_user"
    );


  if(!username){

    showLogin();

    return;

  }


  profileUsername.textContent =
    username;

  profileBox.classList.remove(
    "hidden"
  );


  window.scrollTo({

    top:
      profileBox.offsetTop - 20,

    behavior:"smooth"

  });

}


/* =========================
   ENTRAR AL CASTING
========================= */

function joinCasting(){

  const username =
    localStorage.getItem(
      "tengaged_user"
    );


  if(!username){

    castingMsg.textContent =
      "🔒 Debes iniciar sesión para entrar al casting.";

    showLogin();

    return;

  }


  /* Evitar jugadores duplicados */

  if(
    !castingPlayersList.includes(
      username
    )
  ){

    castingPlayersList.push(
      username
    );

  }


  /* Actualizar lista */

  renderCasting();


  castingMsg.textContent =
    "🎮 " +
    username +
    ", te has unido al Casting #1.";


  userActivity.classList.remove(
    "hidden"
  );


  userActivity.textContent =
    "🎮 " +
    username +
    " se ha unido al Casting #1.";

}


/* =========================
   RESTAURAR SESIÓN
========================= */

function restoreUser(){

  const username =
    localStorage.getItem(
      "tengaged_user"
    );


  if(username){

    showLoggedUser(
      username
    );

  }

}


/* =========================
   INICIO
========================= */

renderCasting();

restoreUser();

</script>

</body>
</html>
