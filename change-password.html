</head><body class="page-personal345"><script src="/shell.js?v=337"></script>
<div class="wrap"><main id="changePassword">
<!-- V346: cambiar contraseña para todos los usuarios, con la misma pantalla que «Información personal». -->
<section class="pi345" aria-labelledby="pwTitle">
 <div class="pi345-head"><h1 id="pwTitle">Cambiar contraseña</h1>
  <nav class="pi345-tabs" aria-label="Opciones de la cuenta"><a class="pi345-btn" href="/profile-edit.html">Información personal</a><a class="pi345-btn" href="/avatar.html">Cambiar imagen</a><a class="pi345-btn on" href="/change-password.html" aria-current="page">Cambiar contraseña</a></nav></div>
 <div class="pi345-body">
  <div class="pi345-side"><a class="pi345-photo" href="/profile.html" id="pwProfile" title="Ver mi perfil"><img id="pwAvatar" alt="Tu avatar"></a><a class="pi345-btn" href="/avatar.html">Cambiar imagen</a></div>
  <form class="pi345-form" id="changeForm" novalidate>
   <p class="pi345-intro" id="pwTemporary" hidden>Has entrado con una contraseña temporal. Elige una nueva para seguir usando tu cuenta.</p>
   <div id="pwCurrentBox"><label class="pi345-label" for="currentPassword">Contraseña actual</label>
   <input class="pi345-soft" id="currentPassword" type="password" maxlength="200" autocomplete="current-password"></div>
   <label class="pi345-label" for="newPassword">Contraseña nueva</label>
   <input class="pi345-soft" id="newPassword" type="password" minlength="8" maxlength="200" autocomplete="new-password" required>
   <span class="pi345-hint">Mínimo 8 caracteres.</span>
   <label class="pi345-label" for="confirmPassword">Repite la contraseña nueva</label>
   <input class="pi345-soft" id="confirmPassword" type="password" minlength="8" maxlength="200" autocomplete="new-password" required>
   <label class="pi345-check"><input type="checkbox" id="pwShow"> Mostrar las contraseñas</label>
   <div class="pi345-row pi345-save"><button class="pi345-btn" type="submit" id="pwSave">Guardar contraseña</button><span id="notice" role="status" aria-live="polite"></span></div>
  </form>
 </div>
</section>
</main></div>
<script type="module" src="/change-password346.js?v=346"></script>
</body></html>
