<!doctype html>
<html lang="es">

<head>

<meta charset="utf-8">

<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Tengaged Reborn - Sala</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#eaf5fb;
  color:#285274;
}

.wrap{
  max-width:1000px;
  margin:auto;
  padding:18px;
}

.header{
  background:white;
  border-radius:14px;
  padding:18px;
  box-shadow:0 4px 14px rgba(0,0,0,.08);
  margin-bottom:18px;
}

.header h1{
  margin:0 0 8px;
}

.connected{
  color:#66859b;
  font-size:14px;
}

.card{
  background:white;
  border-radius:14px;
  padding:20px;
  box-shadow:0 4px 14px rgba(0,0,0,.08);
  margin-bottom:18px;
}

.status{
  padding:14px;
  border-radius:10px;
  margin-bottom:18px;
  font-weight:bold;
}

.status.waiting{
  background:#e8f8ed;
  color:#26733d;
}

.status.started{
  background:#ffe8e8;
  color:#a12626;
}

.players{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
}

.player{
  background:#f8fcfe;
  border:1px solid #d8e7ef;
  border-radius:10px;
  padding:12px;
  display:flex;
  align-items:center;
  gap:10px;
}

.player-name{
  font-weight:bold;
}

.buttons{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  margin-top:20px;
}

button{
  border:0;
  border-radius:10px;
  padding:13px 18px;
  cursor:pointer;
  font-size:15px;
  font-weight:bold;
  background:#2d83b8;
  color:white;
}

button:hover{
  background:#246c97;
}

button.secondary{
  background:#e8f2f7;
  color:#285274;
}

button.start{
  background:#159447;
}

button.start:hover{
  background:#107638;
}

button:disabled{
  opacity:.6;
  cursor:not-allowed;
}

.message{
  margin-top:15px;
  padding:12px;
  border-radius:10px;
  display:none;
}

.message.ok{
  display:block;
  background:#e8f8ed;
  color:#26733d;
}

.message.error{
  display:block;
  background:#ffe8e8;
  color:#a12626;
}

.empty{
  color:#7892a2;
  font-style:italic;
}

@media(max-width:700px){

  .players{
    grid-template-columns:1fr;
  }

}

</style>

</head>

<body>

<div class="wrap">

  <div class="header">

    <h1>🎮 Tengaged Reborn</h1>

    <div
      class="connected"
      id="connectedUser"
    >
      Conectado como...
    </div>

  </div>


  <div class="card">

    <h2>🎮 Sala del Casting #1</h2>

    <p>
      Esta es la sala de espera de la primera partida.
    </p>

    <div
      id="status"
      class="status waiting"
    >
      🟢 Cargando sala...
    </div>


    <h3>
      👥 Jugadores:
      <span id="playerCount">-</span>/16
    </h3>


    <div
      id="players"
      class="players"
    >
      <div class="empty">
        Cargando jugadores...
      </div>
    </div>


    <div class="buttons">

      <button
        id="enterButton"
        onclick="enterRoom()"
      >
        🚪 Entrar en la sala
      </button>

      <button
        class="secondary"
        onclick="loadRoom()"
      >
        🔄 Actualizar
      </button>

      <button
        id="startButton"
        class="start"
        onclick="startGame()"
        style="display:none"
      >
        ▶️ Iniciar partida
      </button>

    </div>


    <div
      id="message"
      class="message"
    ></div>

  </div>


  <div class="card">

    <h3>⚡ Estado</h3>

    <div id="activity">

      La sala se actualiza automáticamente cada 5 segundos.

    </div>

  </div>

</div>


<script>

const username =
  localStorage.getItem("tengaged_user");


if(!username){

  window.location.href="/";

}


document.getElementById(
  "connectedUser"
).textContent =
  "Conectado como " + username;


/* =========================
   CARGAR SALA
========================= */

async function loadRoom(){

  try{

    const response =
      await fetch("/api/room");

    const data =
      await response.json();


    if(!data.ok){

      showMessage(
        data.message ||
        "No se pudo cargar la sala.",
        "error"
      );

      return;

    }


    const room =
      data.room;

    const players =
      data.players || [];


    document.getElementById(
      "playerCount"
    ).textContent =
      players.length;


    renderPlayers(players);


    /*
     * SI LA PARTIDA YA HA COMENZADO
     * mandamos directamente a game.html.
     */

    if(
      room &&
      room.status === "started"
    ){

      showStarted();

      return;

    }


    /*
     * SALA DE ESPERA
     */

    document.getElementById(
      "status"
    ).className =
      "status waiting";

    document.getElementById(
      "status"
    ).textContent =
      "🟢 Sala abierta";


    /*
     * Solo admin1 puede iniciar.
     */

    if(
      username.toLowerCase() ===
      "admin1"
    ){

      document.getElementById(
        "startButton"
      ).style.display =
        "inline-block";

    }else{

      document.getElementById(
        "startButton"
      ).style.display =
        "none";

    }


  }catch(error){

    console.error(error);

    showMessage(
      "Error al conectar con el servidor.",
      "error"
    );

  }

}


/* =========================
   ENTRAR EN LA SALA
========================= */

async function enterRoom(){

  const button =
    document.getElementById(
      "enterButton"
    );


  button.disabled = true;

  button.textContent =
    "⏳ Entrando...";


  try{

    const response =
      await fetch(
        "/api/room",
        {
          method:"POST",

          headers:{
            "Content-Type":
              "application/json"
          },

          body:JSON.stringify({
            username:username
          })
        }
      );


    const data =
      await response.json();


    if(!data.ok){

      showMessage(
        data.message ||
        "No se ha podido entrar en la sala.",
        "error"
      );

      button.disabled=false;

      button.textContent =
        "🚪 Entrar en la sala";

      return;

    }


    /*
     * IMPORTANTE:
     *
     * Si la partida ya está iniciada,
     * vamos directamente al juego.
     */

    if(
      data.room &&
      data.room.status === "started"
    ){

      window.location.href =
        "/game.html";

      return;

    }


    /*
     * Si todavía está esperando,
     * mostramos el mensaje y recargamos.
     */

    showMessage(
      "✅ Has entrado en la sala del Casting #1.",
      "ok"
    );


    button.textContent =
      "✅ Dentro de la sala";


    await loadRoom();


  }catch(error){

    console.error(error);

    showMessage(
      "Error al conectar con el servidor.",
      "error"
    );

    button.disabled=false;

    button.textContent =
      "🚪 Entrar en la sala";

  }

}


/* =========================
   INICIAR PARTIDA
========================= */

async function startGame(){

  const button =
    document.getElementById(
      "startButton"
    );


  button.disabled=true;

  button.textContent =
    "⏳ Iniciando...";


  try{

    const response =
      await fetch(
        "/api/room",
        {
          method:"PUT",

          headers:{
            "Content-Type":
              "application/json"
          },

          body:JSON.stringify({
            username:username
          })
        }
      );


    const data =
      await response.json();


    if(!data.ok){

      showMessage(
        data.message ||
        "No se ha podido iniciar la partida.",
        "error"
      );

      button.disabled=false;

      button.textContent =
        "▶️ Iniciar partida";

      return;

    }


    /*
     * LA PARTIDA HA EMPEZADO.
     *
     * Vamos directamente a game.html.
     */

    showMessage(
      "🚀 La partida ha comenzado.",
      "ok"
    );


    setTimeout(function(){

      window.location.href =
        "/game.html";

    },500);


  }catch(error){

    console.error(error);

    showMessage(
      "Error al conectar con el servidor.",
      "error"
    );

    button.disabled=false;

    button.textContent =
      "▶️ Iniciar partida";

  }

}


/* =========================
   MOSTRAR PARTIDA INICIADA
========================= */

function showStarted(){

  document.getElementById(
    "status"
  ).className =
    "status started";


  document.getElementById(
    "status"
  ).textContent =
    "🔴 Partida iniciada";


  document.getElementById(
    "startButton"
  ).style.display =
    "none";


  document.getElementById(
    "enterButton"
  ).textContent =
    "🚀 Entrar en la partida";


  document.getElementById(
    "enterButton"
  ).disabled=false;


  document.getElementById(
    "enterButton"
  ).onclick =
    function(){

      window.location.href =
        "/game.html";

    };


  document.getElementById(
    "activity"
  ).textContent =
    "🚀 La partida ha comenzado.";


  /*
   * Si el usuario ya está dentro,
   * lo llevamos automáticamente al juego.
   */

  if(username){

    setTimeout(function(){

      window.location.href =
        "/game.html";

    },800);

  }

}


/* =========================
   JUGADORES
========================= */

function renderPlayers(players){

  const container =
    document.getElementById(
      "players"
    );


  container.innerHTML="";


  if(!players.length){

    container.innerHTML =
      '<div class="empty">No hay jugadores.</div>';

    return;

  }


  players.forEach(function(player){

    const name =
      typeof player === "string"
        ? player
        : player.username;


    const div =
      document.createElement("div");


    div.className="player";


    div.innerHTML = `

      <div style="font-size:25px">
        🙂
      </div>

      <div class="player-name">
        ${escapeHtml(name)}
      </div>

    `;


    container.appendChild(div);

  });

}


/* =========================
   MENSAJES
========================= */

function showMessage(
  text,
  type
){

  const message =
    document.getElementById(
      "message"
    );


  message.textContent=text;

  message.className =
    "message " + type;

}


/* =========================
   SEGURIDAD HTML
========================= */

function escapeHtml(value){

  return String(value)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* =========================
   INICIO
========================= */

loadRoom();


setInterval(
  loadRoom,
  5000
);

</script>

</body>

</html>
