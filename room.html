body{

<body>

<div class="wrap">

  <a class="back" href="/">
    ← Volver a los Castings
  </a>

  <div class="head">

    <h1>🎮 Tengaged Reborn</h1>

    <div id="connected">
      Conectado como <strong id="username"></strong>
    </div>

  </div>


  <div class="card">

    <h2>🎮 Sala del Casting #1</h2>

    <p>
      Esta es la sala de espera de la primera partida.
    </p>

    <div id="status" class="status">
      🟢 Sala abierta
    </div>

    <p>
      <strong>Jugadores:</strong>
      <span id="playerCount">0</span>/16
    </p>

    <div id="players" class="players"></div>

  </div>


  <div class="card">

    <h3>Acciones</h3>

    <button onclick="enterRoom()">
      🚪 Entrar en la sala
    </button>

    <button
      class="secondary"
      onclick="loadRoom()"
    >
      🔄 Actualizar
    </button>

    <button
      id="startButton"
      class="start hidden"
      onclick="startGame()"
    >
      ▶️ Iniciar partida
    </button>

    <div id="message" class="message hidden"></div>

  </div>


  <div class="card">

    <h3>📌 Estado</h3>

    <p class="small">
      La sala se actualiza automáticamente cada 5 segundos.
    </p>

  </div>

</div>


<script>

const username =
  localStorage.getItem("tengaged_user");


const usernameElement =
  document.getElementById("username");

const statusElement =
  document.getElementById("status");

const playerCountElement =
  document.getElementById("playerCount");

const playersElement =
  document.getElementById("players");

const messageElement =
  document.getElementById("message");

const startButton =
  document.getElementById("startButton");


/* =========================
   COMPROBAR LOGIN
========================= */

if(!username){

  window.location.href = "/";

}


/* =========================
   MOSTRAR USUARIO
========================= */

usernameElement.textContent =
  username;


/* =========================
   MENSAJES
========================= */

function showMessage(text){

  messageElement.textContent =
    text;

  messageElement.classList.remove(
    "hidden"
  );

}


/* =========================
   CARGAR SALA
========================= */

async function loadRoom(){

  try{

    const response =
      await fetch("/api/room");

    const data =
      await response.json();


    if(!data.ok){

      showMessage(
        data.message ||
        "No se pudo cargar la sala."
      );

      return;

    }


    /* CONTADOR */

    playerCountElement.textContent =
      data.playerCount;


    /* JUGADORES */

    playersElement.innerHTML = "";


    data.players.forEach(function(player){

      const div =
        document.createElement("div");

      div.className =
        "player";

      div.textContent =
        "🙂 " + player.username;

      playersElement.appendChild(div);

    });


    /* ESTADO */

    if(data.room.status === "started"){

      statusElement.textContent =
        "🔴 Partida iniciada";

      statusElement.classList.add(
        "started"
      );

      startButton.classList.add(
        "hidden"
      );

    }else{

      statusElement.textContent =
        "🟢 Sala abierta";

      statusElement.classList.remove(
        "started"
      );


      /*
         SOLO ADMIN1 PUEDE INICIAR
      */

      if(
        username.toLowerCase() ===
        "admin1"
      ){

        startButton.classList.remove(
          "hidden"
        );

      }

    }


  }catch(error){

    showMessage(
      "No se pudo conectar con la sala."
    );

  }

}


/* =========================
   ENTRAR EN LA SALA
========================= */

async function enterRoom(){

  try{

    const response =
      await fetch(
        "/api/room",
        {
          method:"POST",

          headers:{
            "Content-Type":
              "application/json"
          },

          body:JSON.stringify({
            username:username
          })
        }
      );


    const data =
      await response.json();


    if(!data.ok){

      showMessage(
        data.message ||
        "No puedes entrar en la sala."
      );

      return;

    }


    showMessage(
      "✅ " +
      (data.message ||
      "Has entrado en la sala.")
    );


    await loadRoom();


  }catch(error){

    showMessage(
      "Error al entrar en la sala."
    );

  }

}


/* =========================
   INICIAR PARTIDA
========================= */

async function startGame(){

  if(
    username.toLowerCase() !==
    "admin1"
  ){

    showMessage(
      "No tienes permisos para iniciar la partida."
    );

    return;

  }


  const confirmStart =
    confirm(
      "¿Quieres iniciar la partida del Casting #1?"
    );


  if(!confirmStart){

    return;

  }


  try{

    const response =
      await fetch(
        "/api/room",
        {
          method:"PUT",

          headers:{
            "Content-Type":
              "application/json"
          },

          body:JSON.stringify({
            username:username
          })
        }
      );


    const data =
      await response.json();


    if(!data.ok){

      showMessage(
        data.message ||
        "No se pudo iniciar la partida."
      );

      return;

    }


    showMessage(
      "🚀 " +
      (data.message ||
      "La partida ha comenzado.")
    );


    await loadRoom();


  }catch(error){

    showMessage(
      "Error al iniciar la partida."
    );

  }

}


/* =========================
   CARGA INICIAL
========================= */

loadRoom();


/* =========================
   ACTUALIZACIÓN AUTOMÁTICA
========================= */

setInterval(
  loadRoom,
  5000
);

</script>

</body>

</html>
